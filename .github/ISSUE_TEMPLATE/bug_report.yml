name: Bug report
description: Report a reproducible SuperCLI problem without private data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove company names, private paths, hosts, logs and credentials before submitting.
  - type: input
    id: version
    attributes:
      label: SuperCLI version
      placeholder: Output of supercli --version
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include minimal reproduction steps, expected behavior and sanitized output.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal, employer, client and credential data.
          required: true
