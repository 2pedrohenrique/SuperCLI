version: 1
# Leave empty to use the operating system's temporary directory.
capture_dir: ""
log_buffer_lines: 10000
notifications:
  enabled: true

workspaces:
  - id: example
    name: My application
    processes:
      - id: backend
        name: Backend
        command: go
        args: ["run", "."]
        dir: "~/Projects/my-app/backend"
        auto_start: false
        ready_patterns:
          - "(?i)(listening|started|ready)"
        error_patterns:
          - "(?i)(build failed|error|panic|exception)"

      - id: frontend
        name: Frontend
        command: npm
        args: ["start"]
        dir: "~/Projects/my-app/frontend"
        auto_start: false
        ready_patterns:
          - "(?i)(compiled successfully|local:|ready)"
        error_patterns:
          - "(?i)(failed to compile|error)"

    actions:
      - id: open-project
        name: Open project in VS Code
        command: code
        args: ["."]
        dir: "~/Projects/my-app"

      - id: create-feature
        name: Create feature branch
        command: git
        args: ["checkout", "-b", "feature-{{task}}"]
        dir: "~/Projects/my-app"
        confirm: true
        inputs:
          - id: task
            prompt: Task number or branch suffix
